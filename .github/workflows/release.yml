name: Build and release extension

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate, build and package
        run: npm run validate

      - name: Check validation evidence
        run: npm run evidence:check

      - name: Name release archive
        run: cp dist/service-catalog.tar.gz "dist/argocd-service-catalog-develop-${GITHUB_SHA}.tar.gz"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "develop-${GITHUB_SHA}"
          "dist/argocd-service-catalog-develop-${GITHUB_SHA}.tar.gz"
          --target "${GITHUB_SHA}"
          --prerelease
          --generate-notes
