name: Build and release extension

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate, build and package
        run: npm run validate

      - name: Check validation evidence
        run: npm run evidence:check

      - name: Determine development version
        id: version
        run: |
          base_version="$(node -p 'require("./package.json").version')"
          version="${base_version}-dev.${GITHUB_RUN_NUMBER}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Name release archive
        run: cp dist/service-catalog.tar.gz "dist/argocd-service-catalog-${{ steps.version.outputs.version }}.tar.gz"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${VERSION}"
          archive="dist/argocd-service-catalog-${VERSION}.tar.gz"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$archive" --clobber
          else
            gh release create "$tag" "$archive" \
              --target "${GITHUB_SHA}" \
              --title "Argo CD Service Catalog v${VERSION}" \
              --prerelease \
              --generate-notes
          fi
